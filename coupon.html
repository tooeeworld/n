<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피 상품권 받기</title>
<script src="config.js"></script>
<style>
/* 10-18 3판: 설문 페이지와 같은 꼴 (흰 바탕에 검정, 회색 없음, 크림슨은 주 단추만, 글씨 크게, 가운데 폭 640 한 줄) */
:root { --crimson: #862633; }
* { box-sizing: border-box; }
body { margin: 0; background: #f2f5fb; color: #000; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; word-break: keep-all; overflow-wrap: break-word; }   /* 10-18 설문 페이지와 같은 시안 1 카드형 */
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 12px 40px; }
.card { background: #fff; border: 0; border-radius: 18px; box-shadow: 0 2px 14px rgba(30,64,175,.10); padding: 22px 18px; margin: 10px 0; }
h1 { font-size: 26px; margin: 0 0 12px; color: #000; line-height: 1.4; }
p { font-size: 19px; line-height: 1.7; margin: 10px 0; }
.note { background: #eef3fd; border: 0; border-radius: 12px; padding: 12px 14px; font-size: 18.5px; line-height: 1.7; margin: 12px 0; }
.warn { background: #fff3a0; border: 0; border-radius: 12px; padding: 10px 12px; font-size: 18px; font-weight: 800; line-height: 1.6; margin: 0 0 12px; }
label.f { display: block; font-weight: 800; margin: 16px 0 6px; font-size: 19px; }
input[type=tel] { width: 100%; font-size: 24px; padding: 12px; border: 2px solid #b4c2e4; border-radius: 12px; color: #000; background: #fff; }
input[type=tel]:focus { outline: none; border-color: #1e40af; }
button { font: inherit; font-size: 20px; padding: 12px 24px; border-radius: 12px; border: 2px solid var(--crimson); background: var(--crimson); color: #fff; font-weight: 800; min-height: 52px; cursor: pointer; margin-top: 12px; }
button:disabled { opacity: 1; }
.btn2 { display: inline-block; font-size: 19px; padding: 12px 20px; border-radius: 12px; border: 2px solid #1e40af; background: #fff; color: #1e40af; font-weight: 800; text-decoration: none; margin: 8px 6px 0 0; }   /* 그 밖의 단추 = 파랑 테두리와 글씨 (설문 페이지와 같음) */
.msg { color: #000; font-weight: 800; font-size: 18px; min-height: 1.3em; margin: 10px 0 0; }
.msg:empty { min-height: 0; margin: 0; }
.ok { color: #000; font-weight: 800; font-size: 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="warn" id="warn" hidden>저장 주소(config.js)가 없어 신청이 저장되지 않습니다.</div>
    <h1>커피 상품권 받기</h1>
    <div id="form" hidden>
      <p>핸드폰 번호를 남겨 주시면 커피 상품권(5,000원)을 보내 드립니다.</p>
      <div class="note">번호는 상품권 발송에만 쓰며, 설문 응답과 연결하지 않고, 발송 즉시 파기합니다.</div>
      <label class="f" for="phone">핸드폰 번호 (예: 010-1234-5678)</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel">
      <div class="msg" id="msg"></div>
      <button id="send">보내기</button>
    </div>
    <p class="ok" id="okText" hidden></p>
    <p id="info" hidden></p>
    <p id="moreLink"></p>
  </div>
</div>
<script>
/* 상품권 신청: 설문지 하나에 한 번, 한 번에 한 장. 완료 코드 없음, 보내는 것은 번호뿐 (임시 번호·설문지·응답은 안 보냄) */
(function () {
  var SETS = ["A", "B", "C"], K = { done: "napoli_s5_done", cp: "napoli_s5_coupon" };
  function get(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* - */ } }
  function el(id) { return document.getElementById(id); }
  var done = get(K.done, []).map(function (d) { return d.set; }), claimed = get(K.cp, []);
  var want = (/[?&]s=([ABC])/.exec(location.search) || [])[1] || "";
  var open = done.filter(function (s) { return claimed.indexOf(s) < 0; });
  var target = want ? (open.indexOf(want) >= 0 ? want : "") : (open[0] || "");
  function paintMore() {   /* 신청하지 않은 마친 설문지가 더 있으면 그 신청 단추, 할 설문지가 남았으면 '다른 설문지 하나 더' */
    var left = SETS.filter(function (s) { return done.indexOf(s) < 0; });
    var unclaimed = done.filter(function (s) { return claimed.indexOf(s) < 0 && s !== target; });
    var h = "";
    if (unclaimed.length && (el("form").hidden)) h += "<a class=\"btn2\" id=\"nextCoupon\" href=\"coupon.html?s=" + unclaimed[0] + "\">마친 설문지의 상품권 더 신청하기</a> ";
    if (left.length) h += "<a class=\"btn2\" id=\"moreSurvey\" href=\"index.html\">다른 설문지 하나 더</a>";
    el("moreLink").innerHTML = h;
  }
  function info(t) { el("info").textContent = t; el("info").hidden = false; }
  if (!String((window.NAPOLI_SURVEY || {}).endpoint || "").trim()) el("warn").hidden = false;   /* 10-18 실제용: 저장 주소가 없으면 맨 위 경고 (설문 페이지와 같은 말) */
  if (target) el("form").hidden = false;
  else if (want && claimed.indexOf(want) >= 0) info("이 설문지의 상품권은 이미 신청하셨습니다.");
  else if (!want && done.length && !open.length) info("마친 설문지의 상품권은 모두 신청하셨습니다.");
  else info("설문을 마친 뒤에 신청할 수 있습니다.");
  paintMore();
  el("send").onclick = function () {
    var ph = el("phone").value.replace(/[^0-9]/g, "");
    if (!/^01[0-9]{8,9}$/.test(ph)) { el("msg").textContent = "핸드폰 번호를 확인해 주세요. (예: 010-1234-5678)"; return; }
    var ep = String((window.NAPOLI_SURVEY || {}).endpoint || "").trim(), b = el("send");
    function okDone(t) { claimed.push(target); put(K.cp, claimed); el("form").hidden = true; el("okText").textContent = t; el("okText").hidden = false; paintMore(); }
    if (!ep) { okDone("저장 주소가 없어 실제로는 보내지 않았습니다."); return; }
    b.disabled = true; el("msg").textContent = "보내는 중입니다.";
    fetch(ep, { method: "POST", body: JSON.stringify({ type: "coupon", phone: ph }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { b.disabled = false; el("msg").textContent = ""; if (j && j.ok) okDone("신청되었습니다. 곧 상품권을 보내 드리겠습니다."); else el("msg").textContent = "보내지 못했습니다. 다시 눌러 주세요." + (j && j.error ? " (" + j.error + ")" : ""); })
      .catch(function () { b.disabled = false; el("msg").textContent = "보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요."; });
  };
})();
</script>
</body>
</html>
